MujocoPlugins:
  - type: mujoco_ros_lidar/LidarPlugin
    sensors:
    - site_attached: mid360_site
      name: livox/lidar          # topic name
      frame_id: livox_frame
      scan_pattern: mid360       # 'mid360' (built-in) or 'csv'
      # scan_pattern_file: /path/to/mid360.csv  # used with scan_pattern: csv
      update_rate: 10.
      points_per_frame: 20000    # 200k pts/s @ 10 Hz
      min_range: 0.1
      max_range: 40.
      range_std: 0.02
      min_elevation: -0.1222     # -7 deg
      max_elevation: 0.9076      # 52 deg
      num_lines: 4
      intensity_source: color    # 'color' (rgba luminance) or 'geom_user' (<geom user="reflectivity"/>)
      visualize: true           # draw hit points in the MuJoCo viewer (RViz is usually enough)
      visualize_max_points: 2000
      visualize_point_size: 0.02
      ignore_geom_groups: []
      imu_site: mid360_imu       # built-in IMU (livox/imu, acceleration in g). remove to disable
      imu_name: livox/imu
      imu_rate: 200.
